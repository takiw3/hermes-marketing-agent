# Hermes Profile Distribution manifest.
# Schema verified against hermes_cli/profile_distribution.py, and installs
# tested on Hermes 0.20.0 through 0.20.6. `source` and `installed_at` are written by the
# installer and are intentionally not authored here.
name: marketing
version: 1.1.0
description: >-
  Marketing specialist profile for business owners: research, strategy,
  positioning, copywriting, email, social, paid-campaign planning, funnel
  analysis, CRO, competitor intelligence, measurement, and reporting.
  Produces evidence-backed drafts and recommendations; every external action
  requires explicit approval.
hermes_requires: ">=0.20.0"
author: Taki Wong / TakiGPT AI Inc.
license: MIT

# No environment variables are required: the profile is provider-neutral and
# depends on no third-party marketing service for core operation.

# Explicit runtime allowlist. Only these paths are copied on install and
# replaced on update. The path-aware allowlist landed in Hermes 0.20.0
# (release v2026.8.3); before that the installer copies every top-level
# entry and update replaces skills/ wholesale, so 0.20.0 is the honest
# floor for this contract — hence hermes_requires above. Everything else in this
# repository (README, docs, tests, evals, CI, contributor files) never
# reaches an installed profile, and user-owned data (.env, memory, sessions,
# local/, config overrides, skills outside skills/marketing-core/) is never
# touched by updates.
distribution_owned:
  - distribution.yaml
  - profile.yaml
  - SOUL.md
  - config.yaml
  - templates
  - skills/marketing-core
